<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Channel Guard</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #0f1115);
    --text: var(--tg-theme-text-color, #e8eaed);
    --hint: var(--tg-theme-hint-color, #8b93a1);
    --link: var(--tg-theme-link-color, #4dabf7);
    --button: var(--tg-theme-button-color, #21e6b0);
    --button-text: var(--tg-theme-button-text-color, #06231b);
    --secondary-bg: var(--tg-theme-secondary-bg-color, #171a21);
    --section-bg: var(--tg-theme-section-bg-color, var(--secondary-bg));
    --scan: #21e6b0;
    --danger: #ef4444;
    --sev1: #34d399; --sev2: #a3e635; --sev3: #facc15; --sev4: #fb923c; --sev5: #ef4444;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 12px 14px calc(24px + env(safe-area-inset-bottom)) 14px;
    min-height: 100vh;
  }
  .mono { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, monospace; }
  h1 { font-size: 17px; margin: 4px 0 2px; font-weight: 700; }
  .sub { color: var(--hint); font-size: 13px; margin-bottom: 16px; }
  .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  .badge { font-size: 11px; padding: 3px 8px; border-radius: 20px; background: var(--secondary-bg); color: var(--hint); }
  .badge.owner { background: rgba(33,230,176,0.18); color: var(--scan); }

  .card { background: var(--section-bg); border-radius: 14px; padding: 16px; margin-bottom: 12px; }
  .row { display: flex; gap: 8px; }
  .chip {
    flex: 1; text-align: center; padding: 12px; border-radius: 12px; background: var(--bg);
    border: 1.5px solid transparent; color: var(--hint); font-weight: 600; font-size: 14px; cursor: pointer;
    transition: border-color .15s, color .15s;
  }
  .chip.active { border-color: var(--scan); color: var(--text); }
  input[type=text] {
    width: 100%; padding: 13px 14px; border-radius: 12px; border: 1.5px solid var(--secondary-bg);
    background: var(--bg); color: var(--text); font-size: 14px; margin-top: 10px; outline: none;
  }
  input[type=text]:focus { border-color: var(--scan); }
  .btn {
    display: block; width: 100%; padding: 13px; border-radius: 12px; border: none;
    background: var(--button); color: var(--button-text); font-weight: 700; font-size: 14px;
    margin-top: 12px; cursor: pointer; text-align: center;
  }
  .btn.secondary { background: var(--secondary-bg); color: var(--text); }
  .btn.danger { background: var(--danger); color: #fff; }
  .btn:disabled { opacity: .45; }
  .banner { padding: 10px 12px; border-radius: 10px; font-size: 13px; margin-bottom: 12px; }
  .banner.warn { background: rgba(250,204,21,0.15); color: #facc15; }
  .banner.err { background: rgba(239,68,68,0.15); color: #f87171; }

  /* --- Радар-скан: акцентный элемент, а не баннальный progress bar --- */
  .radar-wrap { display: flex; flex-direction: column; align-items: center; padding: 10px 0 4px; }
  .radar {
    position: relative; width: 132px; height: 132px; border-radius: 50%;
    background: conic-gradient(var(--scan) var(--sweep, 0%), rgba(255,255,255,0.06) 0);
    display: flex; align-items: center; justify-content: center;
    transition: background 0.25s ease;
  }
  .radar::before {
    content: ''; position: absolute; inset: 8px; border-radius: 50%; background: var(--bg);
  }
  .radar-core { position: relative; z-index: 1; text-align: center; }
  .radar-pct { font-size: 22px; font-weight: 700; }
  .radar-label { font-size: 10px; color: var(--hint); margin-top: 2px; }
  .scan-stats { display: flex; justify-content: center; gap: 18px; margin-top: 14px; font-size: 12px; color: var(--hint); }
  .scan-stats b { color: var(--text); }

  .vrow { padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.06); display: flex; gap: 10px; }
  .vrow:last-child { border-bottom: none; }
  .vrow input[type=checkbox] { margin-top: 3px; accent-color: var(--scan); width: 16px; height: 16px; flex-shrink: 0; }
  .vidx { font-size: 11px; color: var(--hint); flex-shrink: 0; width: 22px; }
  .vsev { display: flex; gap: 2px; margin: 3px 0 5px; }
  .vsev i { width: 12px; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.08); }
  .vcat { font-weight: 600; font-size: 13.5px; }
  .vreason { font-size: 12.5px; color: var(--hint); margin-top: 3px; line-height: 1.4; }
  .vlink { font-size: 11.5px; color: var(--link); margin-top: 4px; display: inline-block; text-decoration: none; }

  .report-card { background: var(--bg); border-radius: 10px; padding: 12px; margin-top: 10px; }
  .report-text { white-space: pre-wrap; font-size: 12.5px; line-height: 1.5; }
  .copy-btn { font-size: 11px; padding: 6px 10px; border-radius: 8px; background: var(--secondary-bg); color: var(--text); border: none; margin-top: 8px; cursor: pointer; }
  .laws { margin-top: 8px; font-size: 12px; }
  .laws a { color: var(--link); display: block; margin-top: 3px; word-break: break-all; }

  .hidden { display: none !important; }
  .empty { text-align: center; color: var(--hint); font-size: 13px; padding: 30px 10px; }
</style>
</head>
<body>

  <div class="topbar">
    <h1 style="margin:0">🛡 Channel Guard</h1>
    <span class="badge" id="roleBadge">…</span>
  </div>
  <div class="sub">Проверка каналов и групп на нарушения ToS и права EU</div>

  <div id="banner"></div>

  <!-- Экран 1: ввод -->
  <div id="screenInput" class="card">
    <div class="row">
      <div class="chip active" id="chipChannel" data-mode="channel">📡 Канал</div>
      <div class="chip" id="chipGroup" data-mode="group">👥 Группа</div>
    </div>
    <input type="text" id="linkInput" placeholder="https://t.me/name или https://t.me/+xxxx">
    <button class="btn" id="startBtn">Начать скан</button>
  </div>

  <!-- Экран 2: скан -->
  <div id="screenScan" class="card hidden">
    <div class="radar-wrap">
      <div class="radar" id="radar">
        <div class="radar-core">
          <div class="radar-pct mono" id="radarPct">0%</div>
          <div class="radar-label" id="radarLabel">сканирую</div>
        </div>
      </div>
      <div class="scan-stats mono">
        <span>✓ <b id="statDone">0</b>/<span id="statTotal">0</span></span>
        <span>⚠ <b id="statViol">0</b></span>
      </div>
    </div>
    <button class="btn danger" id="stopBtn">⏹ Остановить</button>
  </div>

  <!-- Экран 3: результаты -->
  <div id="screenResults" class="card hidden">
    <div id="resultsSummary" class="sub" style="margin-bottom:8px"></div>
    <div id="violationsList"></div>
    <input type="text" id="selectionInput" placeholder="Номера через запятую или «все» (можно из полного списка)">
    <button class="btn" id="reportBtn">Получить репорт(ы)</button>
    <button class="btn secondary" id="fullListBtn">📄 Скачать весь список</button>
    <button class="btn secondary" id="newScanBtn">🔄 Новый скан</button>
  </div>

  <!-- Экран 4: репорты -->
  <div id="screenReports" class="card hidden">
    <div id="reportsList"></div>
    <button class="btn secondary" id="backFromReportsBtn">◀️ К результатам</button>
  </div>

<script>
const tg = window.Telegram?.WebApp;
tg?.ready(); tg?.expand();
if (tg?.setHeaderColor) { try { tg.setHeaderColor('secondary_bg_color'); } catch(e) {} }

const initData = tg?.initData || '';
const API = (p) => p; // относительные пути — та же origin, что и сама страница

let mode = 'channel';
let currentJobId = null;
let pollTimer = null;
let lastJobResult = null; // {channelLink, totalViolations, top, ...}

function haptic(type) { try { tg?.HapticFeedback?.impactOccurred(type || 'light'); } catch(e) {} }
function showScreen(id) {
  ['screenInput','screenScan','screenResults','screenReports'].forEach(s => {
    document.getElementById(s).classList.toggle('hidden', s !== id);
  });
}
function banner(text, kind) {
  const el = document.getElementById('banner');
  if (!text) { el.innerHTML = ''; return; }
  el.innerHTML = `<div class="banner ${kind||'warn'}">${text}</div>`;
}

async function api(path, opts) {
  const res = await fetch(path, opts);
  let data;
  try { data = await res.json(); } catch(e) { data = {}; }
  return { ok: res.ok, status: res.status, data };
}

// ---- Инициализация: кто я, забанен ли, кулдаун ----
async function init() {
  const { ok, data } = await api('/api/me', {
    method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ initData })
  });
  if (!ok) { banner('Не удалось подтвердить личность. Открой Mini App через кнопку в боте, не напрямую по ссылке.', 'err'); return; }

  document.getElementById('roleBadge').textContent = data.isOwner ? '👑 владелец' : data.isSubAdmin ? '👑 админ' : '';
  if (data.isOwner || data.isSubAdmin) document.getElementById('roleBadge').classList.add('owner');
  if (!data.isOwner && !data.isSubAdmin) document.getElementById('roleBadge').textContent = '';

  if (data.banned) {
    banner('🚫 Ты заблокирован в этом боте.', 'err');
    document.getElementById('startBtn').disabled = true;
    return;
  }
  if (data.cooldownMs > 0) {
    const mins = Math.ceil(data.cooldownMs / 60000);
    banner(`⏳ Кулдаун ещё ${mins} мин — бот общий, квота нейросети одна на всех.`, 'warn');
  }
}
init();

// ---- Экран ввода ----
document.querySelectorAll('.chip').forEach((chip) => {
  chip.addEventListener('click', () => {
    document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    mode = chip.dataset.mode;
    haptic();
  });
});

document.getElementById('startBtn').addEventListener('click', async () => {
  const link = document.getElementById('linkInput').value.trim();
  if (!link) { banner('Вставь ссылку на канал или группу.', 'warn'); return; }
  banner('');
  haptic('medium');
  document.getElementById('startBtn').disabled = true;

  const { ok, status, data } = await api('/api/scan/start', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ initData, link, mode })
  });
  document.getElementById('startBtn').disabled = false;

  if (!ok) {
    if (status === 429) banner(`⏳ Кулдаун ещё ${Math.ceil(data.remainingMs/60000)} мин.`, 'warn');
    else if (status === 403) banner('🚫 Ты заблокирован в этом боте.', 'err');
    else if (data.error === 'bad_link') banner('❌ Нужна ссылка вида https://t.me/name или https://t.me/+xxxx', 'err');
    else banner('❌ Не получилось запустить скан.', 'err');
    return;
  }
  currentJobId = data.jobId;
  showScreen('screenScan');
  pollStatus();
});

// ---- Экран скана ----
document.getElementById('stopBtn').addEventListener('click', async () => {
  haptic('rigid');
  await api('/api/scan/stop', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ initData, jobId: currentJobId }) });
  document.getElementById('radarLabel').textContent = 'останавливаю...';
});

function pollStatus() {
  clearInterval(pollTimer);
  pollTimer = setInterval(async () => {
    const { ok, data } = await api(`/api/scan/status?jobId=${encodeURIComponent(currentJobId)}`);
    if (!ok) { clearInterval(pollTimer); banner('Задача не найдена — начни новый скан.', 'err'); showScreen('screenInput'); return; }

    const pct = data.total > 0 ? Math.min(100, Math.round(data.done / data.total * 100)) : 0;
    document.getElementById('radar').style.setProperty('--sweep', pct + '%');
    document.getElementById('radarPct').textContent = pct + '%';
    document.getElementById('radarLabel').textContent = data.isGroupChat ? 'сканирую группу' : 'сканирую канал';
    document.getElementById('statDone').textContent = data.done;
    document.getElementById('statTotal').textContent = data.total;
    document.getElementById('statViol').textContent = data.violCount;

    if (data.status === 'done' || data.status === 'error' || data.status === 'pending') {
      clearInterval(pollTimer);
      handleScanFinished(data);
    }
  }, 1200);
}

function handleScanFinished(data) {
  if (data.status === 'pending') {
    banner('📨 ' + (data.message || 'Заявка на вступление отправлена — попробуй позже.'), 'warn');
    showScreen('screenInput');
    return;
  }
  if (data.status === 'error') {
    banner('❌ ' + (data.message || 'Ошибка при скане.'), 'err');
    showScreen('screenInput');
    return;
  }

  lastJobResult = data;
  haptic('heavy');

  if (data.totalViolations === 0) {
    document.getElementById('resultsSummary').textContent = `✅ Проверено ${data.textMessagesCount} сообщений в ${data.channelLink} — нарушений не найдено.`;
    document.getElementById('violationsList').innerHTML = '<div class="empty">Чисто 🎉</div>';
    document.getElementById('selectionInput').classList.add('hidden');
    document.getElementById('reportBtn').classList.add('hidden');
    document.getElementById('fullListBtn').classList.add('hidden');
  } else {
    let summary = `🔗 Топ ${data.top.length} из ${data.totalViolations} нарушений в ${data.channelLink}`;
    if (data.aborted) summary = '⏹ Скан остановлен вручную. ' + summary;
    if (data.failedChunks) summary += ` (⚠️ ${data.failedChunks} пачек не проверились)`;
    document.getElementById('resultsSummary').textContent = summary;
    document.getElementById('selectionInput').classList.remove('hidden');
    document.getElementById('reportBtn').classList.remove('hidden');
    document.getElementById('fullListBtn').classList.remove('hidden');

    document.getElementById('violationsList').innerHTML = data.top.map((v) => {
      const filled = Math.max(1, Math.min(5, v.severity || 1));
      const sevColor = ['','var(--sev1)','var(--sev2)','var(--sev3)','var(--sev4)','var(--sev5)'][filled];
      const bars = Array.from({length:5}, (_,i) => `<i style="${i < filled ? `background:${sevColor}` : ''}"></i>`).join('');
      return `<div class="vrow">
        <div class="vidx mono">#${v.index}</div>
        <div style="flex:1">
          <div class="vsev">${bars}</div>
          <div class="vcat">${escapeHtml(v.category || 'нарушение')}</div>
          <div class="vreason">${escapeHtml(v.reason || '')}</div>
        </div>
      </div>`;
    }).join('');
  }

  showScreen('screenResults');
}

function escapeHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ---- Выбор нарушений -> репорт ----
function parseSelection(text, max) {
  const raw = text.trim().toLowerCase();
  if (raw === 'все' || raw === 'всё' || raw === 'all') return Array.from({length: max}, (_,i) => i+1);
  const parts = raw.split(/[,\s]+/).filter(Boolean);
  const nums = new Set();
  for (const p of parts) {
    const n = parseInt(p, 10);
    if (!Number.isInteger(n) || n < 1 || n > max) return null;
    nums.add(n);
  }
  return nums.size ? [...nums].sort((a,b)=>a-b) : null;
}

document.getElementById('reportBtn').addEventListener('click', async () => {
  if (!lastJobResult) return;
  const indices = parseSelection(document.getElementById('selectionInput').value, lastJobResult.totalViolations);
  if (!indices) { banner(`Напиши номера через запятую (1-${lastJobResult.totalViolations}) или «все».`, 'warn'); return; }
  banner('');
  haptic('medium');
  document.getElementById('reportBtn').disabled = true;
  document.getElementById('reportBtn').textContent = 'Готовлю...';

  const { ok, data } = await api('/api/report', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ initData, jobId: currentJobId, indices })
  });

  document.getElementById('reportBtn').disabled = false;
  document.getElementById('reportBtn').textContent = 'Получить репорт(ы)';

  if (!ok || !data.reports?.length) { banner('Не получилось сгенерировать репорт.', 'err'); return; }

  document.getElementById('reportsList').innerHTML = data.reports.map((r) => `
    <div class="report-card">
      <div class="vcat">#${r.index} — ${escapeHtml(r.category||'')} (${r.severity||'?'}/5)</div>
      <div class="vlink"><a href="${r.link}" target="_blank" style="color:var(--link)">${r.link}</a></div>
      <div class="report-text mono" id="reportText${r.index}">${escapeHtml(r.reportText)}</div>
      <button class="copy-btn" data-copy="reportText${r.index}">📋 Скопировать репорт</button>
      <div class="laws">⚖️ Законы:
        ${r.lawLinks.map(l => `<a href="${l}" target="_blank">${l}</a>`).join('')}
      </div>
    </div>
  `).join('');

  document.querySelectorAll('.copy-btn').forEach(b => b.addEventListener('click', () => {
    const text = document.getElementById(b.dataset.copy).textContent;
    navigator.clipboard?.writeText(text).then(() => { b.textContent = '✅ Скопировано'; setTimeout(() => b.textContent = '📋 Скопировать репорт', 1500); });
  }));

  showScreen('screenReports');
});

document.getElementById('fullListBtn').addEventListener('click', () => {
  window.open(`/api/scan/full?jobId=${encodeURIComponent(currentJobId)}`, '_blank');
});
document.getElementById('newScanBtn').addEventListener('click', () => {
  document.getElementById('linkInput').value = '';
  document.getElementById('selectionInput').value = '';
  banner('');
  showScreen('screenInput');
});
document.getElementById('backFromReportsBtn').addEventListener('click', () => showScreen('screenResults'));
</script>
</body>
</html>
