<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Channel Guard</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /*
    Концепция: не "тёмный дашборд с неоновым акцентом", а досмотровый
    сканер — как рентген на таможне. Чёрно-графитовый корпус, янтарный
    луч сканирования (основной сигнал), электрик-циан для ссылок/EU-права
    (второй, холодный сигнал), красный — только для реальной опасности.
    Инспекционный "штамп" на бейдже роли и хэдере — по смыслу приложения.
  */
  :root {
    --bg: var(--tg-theme-bg-color, #060505);
    --text: var(--tg-theme-text-color, #f7f2ea);
    --hint: var(--tg-theme-hint-color, #9c9285);
    --link: var(--tg-theme-link-color, #2fe0ff);
    --button: var(--tg-theme-button-color, #2fe0ff);
    --button-text: var(--tg-theme-button-text-color, #062029);
    --secondary-bg: var(--tg-theme-secondary-bg-color, #17130e);
    --section-bg: var(--tg-theme-section-bg-color, #150f0a);

    --scan: #2fe0ff;
    --scan-soft: rgba(47,224,255,0.16);
    --cyan: #2fe0ff;
    --ok: #38e07a;
    --warn: #ffb300;
    --danger: #ff3b3b;
    --border: rgba(105,219,255,0.16);
    --border-soft: rgba(255,255,255,0.07);

    --sev1: #38e07a; --sev2: #b6e02f; --sev3: #ffcf33; --sev4: #ff8a2b; --sev5: #ff3b3b;

    --font-display: "Space Grotesk", ui-sans-serif, sans-serif;
    --font-body: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, monospace;
  }

  /* ---------- Состояние сканера: цвет фона меняется в зависимости от результата ----------
     idle (ссылка не введена / ожидание) — циан
     safe (нарушений не найдено) — зелёный
     danger (нарушения найдены) — красный
  */
  body { --tint: rgba(47,224,255,0.14); }
  body[data-state="safe"] { --tint: rgba(56,224,122,0.18); }
  body[data-state="danger"] { --tint: rgba(255,59,59,0.22); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    background:
      repeating-linear-gradient(0deg, rgba(255,255,255,0.018) 0px, rgba(255,255,255,0.018) 1px, transparent 1px, transparent 3px),
      radial-gradient(ellipse 120% 60% at 50% -8%, var(--tint), transparent 55%),
      radial-gradient(ellipse 90% 50% at 100% 110%, rgba(47,224,255,0.08), transparent 60%),
      var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    padding: 14px 14px calc(28px + env(safe-area-inset-bottom)) 14px;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  .mono { font-family: var(--font-mono); }

  /* ---------- Иконки: тонкая линия, currentColor, вместо стоковых эмодзи ---------- */
  .ic {
    width: 1.05em; height: 1.05em; display: inline-block; vertical-align: -0.16em;
    flex-shrink: 0; stroke: currentColor; fill: none; stroke-width: 1.8;
    stroke-linecap: round; stroke-linejoin: round;
  }
  .ic-fill { fill: currentColor; stroke: none; }
  .ic-amber { color: var(--scan); }
  .ic-cyan { color: var(--cyan); }
  .ic-danger { color: var(--danger); }
  .ic-ok { color: var(--ok); }
  .ic-muted { color: var(--hint); }

  /* ---------- Topbar ---------- */
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 6px; }
  .brand { display: flex; align-items: center; gap: 11px; }
  .brand-mark {
    width: 38px; height: 38px; border-radius: 11px; flex-shrink: 0; position: relative;
    background: linear-gradient(155deg, rgba(47,224,255,0.28), rgba(47,224,255,0.05));
    border: 1px solid rgba(47,224,255,0.45);
    box-shadow: 0 0 18px -4px rgba(47,224,255,0.55), inset 0 0 12px rgba(47,224,255,0.08);
    display: flex; align-items: center; justify-content: center;
  }
  .brand-mark svg { width: 20px; height: 20px; display: block; }
  h1 {
    font-family: var(--font-display); font-size: 18px; letter-spacing: -0.01em;
    margin: 0; font-weight: 700; line-height: 1.15;
  }
  .brand-eyebrow {
    font-family: var(--font-mono); font-size: 9.5px; color: var(--cyan); letter-spacing: .14em;
    text-transform: uppercase; margin-bottom: 2px; opacity: .85;
  }
  .sub { color: var(--hint); font-size: 12.5px; margin: 8px 2px 16px; letter-spacing: .01em; }

  /* Инспекционный штамп-бейдж вместо обычной пилюли */
  .badge {
    font-family: var(--font-mono); font-size: 10px; padding: 6px 10px; border-radius: 7px;
    background: transparent; color: var(--hint); border: 1.5px dashed var(--border-soft);
    white-space: nowrap; text-transform: uppercase; letter-spacing: .08em; font-weight: 600;
  }
  .badge.owner { color: var(--scan); border-color: rgba(47,224,255,0.5); background: rgba(47,224,255,0.08); }

  /* ---------- Cards ---------- */
  .card {
    background: linear-gradient(180deg, var(--section-bg), rgba(0,0,0,0.15));
    border: 1px solid var(--border-soft);
    border-top: 1px solid rgba(47,224,255,0.22);
    border-radius: 16px; padding: 18px; margin-bottom: 12px;
    box-shadow: 0 20px 40px -24px rgba(0,0,0,0.85), inset 0 1px 0 rgba(255,255,255,0.03);
  }

  /* ---------- Segmented mode switch ---------- */
  .row { display: flex; gap: 6px; padding: 4px; background: rgba(0,0,0,0.35); border-radius: 12px; border: 1px solid var(--border-soft); }
  .chip {
    flex: 1; text-align: center; padding: 11px 8px; border-radius: 9px; background: transparent;
    border: none; color: var(--hint); font-weight: 600; font-size: 13.5px; cursor: pointer;
    transition: background .18s ease, color .18s ease, box-shadow .18s ease;
    display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .chip.active {
    background: linear-gradient(155deg, rgba(47,224,255,0.22), rgba(47,224,255,0.06));
    color: var(--scan);
    box-shadow: inset 0 0 0 1px rgba(47,224,255,0.4), 0 0 16px -6px rgba(47,224,255,0.5);
  }
  .chip:active { transform: scale(0.97); }

  .field-label { font-size: 10.5px; color: var(--hint); margin: 14px 0 6px 2px; text-transform: uppercase; letter-spacing: .1em; font-weight: 700; }
  input[type=text] {
    width: 100%; padding: 13px 14px; border-radius: 11px; border: 1px solid var(--border-soft);
    background: rgba(0,0,0,0.35); color: var(--text); font-size: 14px; font-family: var(--font-mono);
    outline: none; transition: border-color .15s ease, box-shadow .15s ease;
  }
  input[type=text]::placeholder { color: var(--hint); font-family: var(--font-body); opacity: .8; }
  input[type=text]:focus { border-color: var(--scan); box-shadow: 0 0 0 3px rgba(47,224,255,0.14); }

  .btn {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    width: 100%; padding: 14px; border-radius: 12px; border: none;
    background: linear-gradient(155deg, #7de9ff, var(--button));
    color: var(--button-text); font-weight: 800; font-size: 14.5px;
    font-family: var(--font-body);
    margin-top: 12px; cursor: pointer; text-align: center;
    box-shadow: 0 14px 28px -14px rgba(47,224,255,0.65);
    transition: transform .12s ease, box-shadow .12s ease, opacity .12s ease;
  }
  .btn:active { transform: scale(0.98); box-shadow: 0 6px 16px -10px rgba(47,224,255,0.55); }
  .btn.secondary { background: rgba(255,255,255,0.04); color: var(--text); box-shadow: none; border: 1px solid var(--border-soft); }
  .btn.danger {
    background: repeating-linear-gradient(135deg, rgba(255,59,59,0.16), rgba(255,59,59,0.16) 8px, rgba(255,59,59,0.08) 8px, rgba(255,59,59,0.08) 16px);
    color: #ffb0b0; border: 1px solid rgba(255,59,59,0.4); box-shadow: none;
  }
  .btn.danger:active { background: rgba(255,59,59,0.24); }
  .btn:disabled { opacity: .4; box-shadow: none; }

  .banner {
    padding: 11px 13px; border-radius: 11px; font-size: 13px; margin-bottom: 12px;
    border: 1px solid transparent; line-height: 1.4;
  }
  .banner.warn { background: rgba(255,179,0,0.1); color: #ffcf6b; border-color: rgba(255,179,0,0.3); }
  .banner.err { background: rgba(255,59,59,0.1); color: #ff9494; border-color: rgba(255,59,59,0.3); }

  /* ---------- Signature element: досмотровый сканер / прицел-локатор ---------- */
  .radar-wrap { display: flex; flex-direction: column; align-items: center; padding: 16px 0 6px; }
  .radar {
    position: relative; width: 176px; height: 176px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
  }
  /* внешнее кольцо с делениями, как на объективе/прицеле */
  .radar-ticks {
    position: absolute; inset: 0; border-radius: 50%;
    background:
      repeating-conic-gradient(from 0deg, rgba(47,224,255,0.55) 0deg 1.2deg, transparent 1.2deg 30deg);
    mask: radial-gradient(circle, transparent 91%, #000 92%, #000 97%, transparent 98%);
    -webkit-mask: radial-gradient(circle, transparent 91%, #000 92%, #000 97%, transparent 98%);
    animation: spin-slow 18s linear infinite;
  }
  @keyframes spin-slow { to { transform: rotate(360deg); } }
  /* пунктирное вращающееся кольцо диафрагмы */
  .radar::before {
    content: ''; position: absolute; inset: 14px; border-radius: 50%;
    border: 1.5px dashed rgba(47,224,255,0.35);
    animation: spin-rev 12s linear infinite;
  }
  @keyframes spin-rev { to { transform: rotate(-360deg); } }
  /* кольцо прогресса — управляется JS через --sweep */
  .radar-ring {
    position: absolute; inset: 22px; border-radius: 50%;
    background: conic-gradient(var(--scan) var(--sweep, 0%), rgba(255,255,255,0.06) 0);
    transition: background 0.3s ease;
    filter: drop-shadow(0 0 10px rgba(47,224,255,0.5));
  }
  .radar-ring::before {
    content: ''; position: absolute; inset: 8px; border-radius: 50%; background: var(--bg);
  }
  /* крестовина прицела */
  .radar-cross i {
    position: absolute; background: rgba(47,224,255,0.4);
  }
  .radar-cross i:nth-child(1) { top: 0; bottom: 0; left: 50%; width: 1px; margin-left: -0.5px; }
  .radar-cross i:nth-child(2) { left: 0; right: 0; top: 50%; height: 1px; margin-top: -0.5px; }
  .radar-blip {
    position: absolute; width: 5px; height: 5px; border-radius: 50%; background: var(--cyan);
    box-shadow: 0 0 7px 1.5px rgba(47,224,255,0.8);
    animation: blip 2.6s ease-in-out infinite;
  }
  .radar-blip.b1 { top: 26%; left: 32%; animation-delay: .1s; }
  .radar-blip.b2 { top: 68%; left: 72%; animation-delay: .9s; }
  .radar-blip.b3 { top: 76%; left: 28%; animation-delay: 1.7s; }
  @keyframes blip { 0%, 100% { opacity: 0; transform: scale(.6); } 15%, 40% { opacity: 1; transform: scale(1); } }
  .radar-core { position: relative; z-index: 1; text-align: center; }
  .radar-pct { font-family: var(--font-mono); font-size: 28px; font-weight: 700; letter-spacing: -0.02em; text-shadow: 0 0 18px rgba(47,224,255,0.45); }
  .radar-label { font-size: 10.5px; color: var(--hint); margin-top: 3px; text-transform: uppercase; letter-spacing: .08em; }
  .scan-stats { display: flex; justify-content: center; gap: 10px; margin-top: 20px; width: 100%; }
  .stat-pill {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px;
    padding: 10px 6px; border-radius: 11px; background: rgba(0,0,0,0.35); border: 1px solid var(--border-soft);
  }
  @keyframes bump { 0% { transform: scale(1); } 40% { transform: scale(1.18); } 100% { transform: scale(1); } }
  .stat-pill b { font-family: var(--font-mono); font-size: 16px; color: var(--text); font-weight: 700; }
  @keyframes bump { 0% { transform: scale(1); } 40% { transform: scale(1.18); } 100% { transform: scale(1); } }
  .stat-pill b.bump { animation: bump .28s ease; display: inline-block; }
  .stat-pill span { font-size: 9.5px; color: var(--hint); text-transform: uppercase; letter-spacing: .06em; }
  .stat-pill.viol b { color: var(--danger); }

  /* ---------- Violation rows ---------- */
  .vrow {
    padding: 13px; margin-bottom: 8px; border-radius: 12px; display: flex; gap: 11px;
    background: rgba(0,0,0,0.3); border: 1px solid var(--border-soft); border-left: 2px solid rgba(47,224,255,0.3);
  }
  .vidx {
    font-family: var(--font-mono); font-size: 11px; color: var(--hint); flex-shrink: 0; width: 26px;
    padding-top: 2px;
  }
  .vsev { display: flex; gap: 3px; margin: 0 0 6px; }
  .vsev i { width: 13px; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.09); display: block; }
  .vcat { font-family: var(--font-display); font-weight: 600; font-size: 14px; letter-spacing: -0.01em; }
  .vreason { font-size: 12.5px; color: var(--hint); margin-top: 4px; line-height: 1.45; }
  .vlink { font-family: var(--font-mono); font-size: 11px; color: var(--link); margin-top: 6px; display: inline-block; text-decoration: none; }

  /* ---------- Reports ---------- */
  .report-card {
    background: rgba(0,0,0,0.3); border-radius: 12px; padding: 13px; margin-top: 10px;
    border: 1px solid var(--border-soft); border-left: 3px solid var(--scan);
  }
  .report-text { white-space: pre-wrap; font-size: 12.5px; line-height: 1.55; font-family: var(--font-mono); color: var(--text); }
  .copy-btn {
    font-family: var(--font-body); font-size: 11.5px; font-weight: 700; padding: 7px 12px; border-radius: 9px;
    background: rgba(47,224,255,0.1); color: var(--scan); border: 1px solid rgba(47,224,255,0.3); margin-top: 9px; cursor: pointer;
  }
  .copy-btn:active { background: rgba(47,224,255,0.2); }
  .laws { margin-top: 10px; font-size: 11.5px; color: var(--hint); }
  .laws a { font-family: var(--font-mono); color: var(--cyan); display: block; margin-top: 4px; word-break: break-all; text-decoration: none; }

  .hidden { display: none !important; }
  .empty { text-align: center; color: var(--hint); font-size: 13px; padding: 34px 10px; }
  .empty .empty-icon { font-size: 26px; margin-bottom: 8px; }

  @media (prefers-reduced-motion: reduce) {
    .radar-ticks, .radar::before { animation: none !important; }
    .screen-enter, .vrow, .report-card { animation: none !important; }
  }

  /* ---------- Анимации переходов между экранами и появления элементов ---------- */
  @keyframes screenIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .screen-enter { animation: screenIn .38s cubic-bezier(.2,.7,.3,1) both; }

  @keyframes rowIn {
    from { opacity: 0; transform: translateY(6px) scale(.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  .vrow, .report-card { animation: rowIn .3s ease both; }

  @keyframes inputGlow {
    0%, 100% { box-shadow: 0 0 0 3px rgba(47,224,255,0.14); }
    50% { box-shadow: 0 0 0 5px rgba(47,224,255,0.22); }
  }
  input[type=text].live:focus { animation: inputGlow 1.8s ease-in-out infinite; }
</style>
</head>
<body>

  <div class="topbar">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none"><path d="M12 2.5l7.5 3v5.2c0 4.9-3.2 8.9-7.5 10.3-4.3-1.4-7.5-5.4-7.5-10.3V5.5l7.5-3z" stroke="#2fe0ff" stroke-width="1.6" stroke-linejoin="round"/><path d="M8.7 12.2l2.3 2.3 4.3-4.6" stroke="#2fe0ff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <div>
        <div class="brand-eyebrow">Досмотровый сканер</div>
        <h1>Channel Guard</h1>
      </div>
    </div>
    <span class="badge" id="roleBadge">…</span>
  </div>
  <div class="sub">Проверка каналов и групп на нарушения ToS и права EU</div>

  <div id="banner"></div>

  <!-- Экран 1: ввод -->
  <div id="screenInput" class="card">
    <div class="row">
      <div class="chip active" id="chipChannel" data-mode="channel"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="19" r="1.6" class="ic-fill"/><path d="M8.5 14.7a5 5 0 017 0M5.3 11.5a9.3 9.3 0 0113.4 0"/></svg> Канал</div>
      <div class="chip" id="chipGroup" data-mode="group"><svg class="ic" viewBox="0 0 24 24"><circle cx="9" cy="8.5" r="3"/><path d="M2.7 19c.7-3.3 3.1-5 6.3-5s5.6 1.7 6.3 5"/><path d="M15.8 5.2a3 3 0 010 6.4"/><path d="M17.2 14.2c2 .5 3.4 1.9 3.8 4.3"/></svg> Группа</div>
    </div>
    <div class="field-label">Ссылка на объект проверки</div>
    <input type="text" id="linkInput" placeholder="https://t.me/name или https://t.me/+xxxx">
    <button class="btn" id="startBtn">Начать скан</button>
  </div>

  <!-- Экран 2: скан -->
  <div id="screenScan" class="card hidden">
    <div class="radar-wrap">
      <div class="radar" id="radar">
        <div class="radar-ticks"></div>
        <div class="radar-blip b1"></div>
        <div class="radar-blip b2"></div>
        <div class="radar-blip b3"></div>
        <div class="radar-ring"></div>
        <div class="radar-cross"><i></i><i></i></div>
        <div class="radar-core">
          <div class="radar-pct mono" id="radarPct">0%</div>
          <div class="radar-label" id="radarLabel">сканирую</div>
        </div>
      </div>
      <div class="scan-stats">
        <div class="stat-pill"><b id="statDone">0</b><span>из <span id="statTotal">0</span></span></div>
        <div class="stat-pill viol"><b id="statViol">0</b><span>нарушений</span></div>
      </div>
    </div>
    <button class="btn danger" id="stopBtn"><svg class="ic" viewBox="0 0 24 24"><rect x="6.5" y="6.5" width="11" height="11" rx="1.5" class="ic-fill"/></svg> Остановить</button>
  </div>

  <!-- Экран 3: результаты -->
  <div id="screenResults" class="card hidden">
    <div id="resultsSummary" class="sub" style="margin-bottom:8px"></div>
    <div id="violationsList"></div>
    <div class="field-label">Выбор для репорта</div>
    <input type="text" id="selectionInput" placeholder="Номера через запятую или «все»">
    <button class="btn" id="reportBtn">Получить репорт(ы)</button>
    <button class="btn secondary" id="fullListBtn"><svg class="ic" viewBox="0 0 24 24"><path d="M7 3.5h6.5L18 8v11.5a1 1 0 01-1 1H7a1 1 0 01-1-1v-15a1 1 0 011-1z"/><path d="M13.5 3.5V8H18"/><path d="M9.5 12l0 5M9.5 17l-2-2M9.5 17l2-2"/></svg> Скачать весь список</button>
    <button class="btn secondary" id="newScanBtn"><svg class="ic" viewBox="0 0 24 24"><path d="M3.5 12a8.5 8.5 0 0114.6-6"/><path d="M20.5 12a8.5 8.5 0 01-14.6 6"/><path d="M18.5 2.8v3.7h-3.7"/><path d="M5.5 21.2v-3.7h3.7"/></svg> Новый скан</button>
  </div>

  <!-- Экран 4: репорты -->
  <div id="screenReports" class="card hidden">
    <div id="reportsList"></div>
    <button class="btn secondary" id="backFromReportsBtn"><svg class="ic" viewBox="0 0 24 24"><path d="M14.5 5.5l-6.5 6.5 6.5 6.5"/></svg> К результатам</button>
  </div>

<script>
const tg = window.Telegram?.WebApp;
tg?.ready(); tg?.expand();
if (tg?.setHeaderColor) { try { tg.setHeaderColor('secondary_bg_color'); } catch(e) {} }

const initData = tg?.initData || '';
const API = (p) => p; // относительные пути — та же origin, что и сама страница

// ---- Иконки для динамических текстов (вместо стоковых эмодзи) ----
const ICONS = {
  crown: '<svg class="ic" viewBox="0 0 24 24"><path d="M3.5 8l4 3 4.5-5.5L16.5 11l4-3-1.7 9H5.2L3.5 8z"/><path d="M5 20h14"/></svg>',
  ban: '<svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M6.3 6.3l11.4 11.4"/></svg>',
  clock: '<svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v4.3l3 1.8"/></svg>',
  xCircle: '<svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M9.3 9.3l5.4 5.4M14.7 9.3l-5.4 5.4"/></svg>',
  send: '<svg class="ic" viewBox="0 0 24 24"><path d="M21 3L3 10.3l7 2.5m11-9.8L13 21l-2.7-8.2"/></svg>',
  checkCircle: '<svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M8.3 12.5l2.6 2.6 5-5.2"/></svg>',
  sparkle: '<svg class="ic" viewBox="0 0 24 24"><path d="M12 3l1.7 4.3L18 9l-4.3 1.7L12 15l-1.7-4.3L6 9l4.3-1.7L12 3z"/><path d="M19 15l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8.8-2z"/></svg>',
  link: '<svg class="ic" viewBox="0 0 24 24"><path d="M9.5 14.5l5-5"/><path d="M10.3 6.8l.9-.9a3.4 3.4 0 014.9 4.9l-.9.9M13.7 17.2l-.9.9a3.4 3.4 0 01-4.9-4.9l.9-.9"/></svg>',
  stop: '<svg class="ic" viewBox="0 0 24 24"><rect x="6.5" y="6.5" width="11" height="11" rx="1.5" class="ic-fill"/></svg>',
  warnTriangle: '<svg class="ic" viewBox="0 0 24 24"><path d="M12 4l9 15.5H3L12 4z"/><path d="M12 10v4M12 16.8h.01"/></svg>',
  copy: '<svg class="ic" viewBox="0 0 24 24"><rect x="8.5" y="8.5" width="11" height="11" rx="1.6"/><path d="M5.5 15.5h-1a1 1 0 01-1-1v-9a1 1 0 011-1h9a1 1 0 011 1v1"/></svg>',
  scale: '<svg class="ic" viewBox="0 0 24 24"><path d="M12 3v17.5M6 21h12"/><path d="M4 7l-2.5 5.5a2.7 2.7 0 005 0L4 7z"/><path d="M20 7l-2.5 5.5a2.7 2.7 0 005 0L20 7z"/><path d="M4 7l8-2.5L20 7"/></svg>',
};
function ic(name, cls) { return (ICONS[name] || '').replace('class="ic"', `class="ic${cls ? ' ' + cls : ''}"`); }

let mode = 'channel';
let currentJobId = null;
let pollTimer = null;
let lastJobResult = null; // {channelLink, totalViolations, top, ...}

function setState(state) { document.body.dataset.state = state; }
function haptic(type) { try { tg?.HapticFeedback?.impactOccurred(type || 'light'); } catch(e) {} }
function showScreen(id) {
  ['screenInput','screenScan','screenResults','screenReports'].forEach(s => {
    document.getElementById(s).classList.toggle('hidden', s !== id);
  });
  const el = document.getElementById(id);
  el.classList.remove('screen-enter');
  void el.offsetWidth; // рестарт анимации
  el.classList.add('screen-enter');
}
function banner(text, kind) {
  const el = document.getElementById('banner');
  if (!text) { el.innerHTML = ''; return; }
  el.innerHTML = `<div class="banner ${kind||'warn'}">${text}</div>`;
}

async function api(path, opts) {
  const res = await fetch(path, opts);
  let data;
  try { data = await res.json(); } catch(e) { data = {}; }
  return { ok: res.ok, status: res.status, data };
}

// ---- Инициализация: кто я, забанен ли, кулдаун ----
async function init() {
  setState('idle');
  const { ok, data } = await api('/api/me', {
    method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ initData })
  });
  if (!ok) { banner('Не удалось подтвердить личность. Открой Mini App через кнопку в боте, не напрямую по ссылке.', 'err'); return; }

  document.getElementById('roleBadge').innerHTML = data.isOwner ? ic('crown') + ' владелец' : data.isSubAdmin ? ic('crown') + ' админ' : '';
  if (data.isOwner || data.isSubAdmin) document.getElementById('roleBadge').classList.add('owner');
  if (!data.isOwner && !data.isSubAdmin) document.getElementById('roleBadge').innerHTML = '';

  if (data.banned) {
    banner(ic('ban') + ' Ты заблокирован в этом боте.', 'err');
    document.getElementById('startBtn').disabled = true;
    return;
  }
  if (data.cooldownMs > 0) {
    const mins = Math.ceil(data.cooldownMs / 60000);
    banner(`${ic('clock')} Кулдаун ещё ${mins} мин — бот общий, квота нейросети одна на всех.`, 'warn');
  }
}
init();

// ---- Экран ввода ----
document.querySelectorAll('.chip').forEach((chip) => {
  chip.addEventListener('click', () => {
    document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    mode = chip.dataset.mode;
    haptic();
  });
});

document.getElementById('linkInput').addEventListener('input', (e) => {
  e.target.classList.toggle('live', e.target.value.trim().length > 0);
});

document.getElementById('startBtn').addEventListener('click', async () => {
  const link = document.getElementById('linkInput').value.trim();
  if (!link) { banner('Вставь ссылку на канал или группу.', 'warn'); return; }
  banner('');
  setState('idle');
  haptic('medium');
  document.getElementById('startBtn').disabled = true;

  const { ok, status, data } = await api('/api/scan/start', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ initData, link, mode })
  });
  document.getElementById('startBtn').disabled = false;

  if (!ok) {
    if (status === 429) banner(`${ic('clock')} Кулдаун ещё ${Math.ceil(data.remainingMs/60000)} мин.`, 'warn');
    else if (status === 403) banner(ic('ban') + ' Ты заблокирован в этом боте.', 'err');
    else if (data.error === 'bad_link') banner(ic('xCircle') + ' Нужна ссылка вида https://t.me/name или https://t.me/+xxxx', 'err');
    else banner(ic('xCircle') + ' Не получилось запустить скан.', 'err');
    return;
  }
  currentJobId = data.jobId;
  showScreen('screenScan');
  pollStatus();
});

// ---- Экран скана ----
document.getElementById('stopBtn').addEventListener('click', async () => {
  haptic('rigid');
  await api('/api/scan/stop', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ initData, jobId: currentJobId }) });
  document.getElementById('radarLabel').textContent = 'останавливаю...';
});

function bumpStat(id, value) {
  const el = document.getElementById(id);
  if (el.textContent !== String(value)) {
    el.textContent = value;
    el.classList.remove('bump');
    void el.offsetWidth;
    el.classList.add('bump');
  }
}

function pollStatus() {
  clearInterval(pollTimer);
  pollTimer = setInterval(async () => {
    const { ok, data } = await api(`/api/scan/status?jobId=${encodeURIComponent(currentJobId)}`);
    if (!ok) { clearInterval(pollTimer); banner('Задача не найдена — начни новый скан.', 'err'); showScreen('screenInput'); return; }

    const pct = data.total > 0 ? Math.min(100, Math.round(data.done / data.total * 100)) : 0;
    document.getElementById('radar').style.setProperty('--sweep', pct + '%');
    document.getElementById('radarPct').textContent = pct + '%';
    document.getElementById('radarLabel').textContent = data.isGroupChat ? 'сканирую группу' : 'сканирую канал';
    bumpStat('statDone', data.done);
    document.getElementById('statTotal').textContent = data.total;
    bumpStat('statViol', data.violCount);

    if (data.status === 'done' || data.status === 'error' || data.status === 'pending') {
      clearInterval(pollTimer);
      handleScanFinished(data);
    }
  }, 1200);
}

function handleScanFinished(data) {
  if (data.status === 'pending') {
    setState('idle');
    banner(ic('send') + ' ' + (data.message || 'Заявка на вступление отправлена — попробуй позже.'), 'warn');
    showScreen('screenInput');
    return;
  }
  if (data.status === 'error') {
    setState('idle');
    banner(ic('xCircle') + ' ' + (data.message || 'Ошибка при скане.'), 'err');
    showScreen('screenInput');
    return;
  }

  lastJobResult = data;
  haptic('heavy');

  if (data.totalViolations === 0) {
    setState('safe');
    document.getElementById('resultsSummary').innerHTML = `${ic('checkCircle', 'ic-ok')} Проверено ${data.textMessagesCount} сообщений в ${data.channelLink} — нарушений не найдено.`;
    document.getElementById('violationsList').innerHTML = `<div class="empty"><div class="empty-icon" style="color:var(--ok)">${ic('sparkle')}</div>Чисто</div>`;
    document.getElementById('selectionInput').classList.add('hidden');
    document.getElementById('reportBtn').classList.add('hidden');
    document.getElementById('fullListBtn').classList.add('hidden');
  } else {
    setState('danger');
    let summary = `${ic('link', 'ic-cyan')} Топ ${data.top.length} из ${data.totalViolations} нарушений в ${data.channelLink}`;
    if (data.aborted) summary = ic('stop', 'ic-danger') + ' Скан остановлен вручную. ' + summary;
    if (data.failedChunks) summary += ` (${ic('warnTriangle', 'ic-amber')} ${data.failedChunks} пачек не проверились)`;
    document.getElementById('resultsSummary').innerHTML = summary;
    document.getElementById('selectionInput').classList.remove('hidden');
    document.getElementById('reportBtn').classList.remove('hidden');
    document.getElementById('fullListBtn').classList.remove('hidden');

    document.getElementById('violationsList').innerHTML = data.top.map((v, i) => {
      const filled = Math.max(1, Math.min(5, v.severity || 1));
      const sevColor = ['','var(--sev1)','var(--sev2)','var(--sev3)','var(--sev4)','var(--sev5)'][filled];
      const bars = Array.from({length:5}, (_,i) => `<i style="${i < filled ? `background:${sevColor}` : ''}"></i>`).join('');
      return `<div class="vrow" style="animation-delay:${Math.min(i, 10) * 45}ms">
        <div class="vidx mono">#${v.index}</div>
        <div style="flex:1">
          <div class="vsev">${bars}</div>
          <div class="vcat">${escapeHtml(v.category || 'нарушение')}</div>
          <div class="vreason">${escapeHtml(v.reason || '')}</div>
        </div>
      </div>`;
    }).join('');
  }

  showScreen('screenResults');
}

function escapeHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ---- Выбор нарушений -> репорт ----
function parseSelection(text, max) {
  const raw = text.trim().toLowerCase();
  if (raw === 'все' || raw === 'всё' || raw === 'all') return Array.from({length: max}, (_,i) => i+1);
  const parts = raw.split(/[,\s]+/).filter(Boolean);
  const nums = new Set();
  for (const p of parts) {
    const n = parseInt(p, 10);
    if (!Number.isInteger(n) || n < 1 || n > max) return null;
    nums.add(n);
  }
  return nums.size ? [...nums].sort((a,b)=>a-b) : null;
}

document.getElementById('reportBtn').addEventListener('click', async () => {
  if (!lastJobResult) return;
  const indices = parseSelection(document.getElementById('selectionInput').value, lastJobResult.totalViolations);
  if (!indices) { banner(`Напиши номера через запятую (1-${lastJobResult.totalViolations}) или «все».`, 'warn'); return; }
  banner('');
  haptic('medium');
  document.getElementById('reportBtn').disabled = true;
  document.getElementById('reportBtn').textContent = 'Готовлю...';

  const { ok, data } = await api('/api/report', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ initData, jobId: currentJobId, indices })
  });

  document.getElementById('reportBtn').disabled = false;
  document.getElementById('reportBtn').textContent = 'Получить репорт(ы)';

  if (!ok || !data.reports?.length) { banner('Не получилось сгенерировать репорт.', 'err'); return; }

  document.getElementById('reportsList').innerHTML = data.reports.map((r, i) => `
    <div class="report-card" style="animation-delay:${Math.min(i, 10) * 60}ms">
      <div class="vcat">#${r.index} — ${escapeHtml(r.category||'')} (${r.severity||'?'}/5)</div>
      <div class="vlink"><a href="${r.link}" target="_blank" style="color:var(--link)">${r.link}</a></div>
      <div class="report-text mono" id="reportText${r.index}">${escapeHtml(r.reportText)}</div>
      <button class="copy-btn" data-copy="reportText${r.index}">${ic('copy')} Скопировать репорт</button>
      <div class="laws">${ic('scale', 'ic-cyan')} Законы:
        ${r.lawLinks.map(l => `<a href="${l}" target="_blank">${l}</a>`).join('')}
      </div>
    </div>
  `).join('');

  document.querySelectorAll('.copy-btn').forEach(b => b.addEventListener('click', () => {
    const text = document.getElementById(b.dataset.copy).textContent;
    navigator.clipboard?.writeText(text).then(() => { b.innerHTML = ic('checkCircle', 'ic-ok') + ' Скопировано'; setTimeout(() => b.innerHTML = ic('copy') + ' Скопировать репорт', 1500); });
  }));

  showScreen('screenReports');
});

document.getElementById('fullListBtn').addEventListener('click', () => {
  window.open(`/api/scan/full?jobId=${encodeURIComponent(currentJobId)}`, '_blank');
});
document.getElementById('newScanBtn').addEventListener('click', () => {
  document.getElementById('linkInput').value = '';
  document.getElementById('selectionInput').value = '';
  banner('');
  setState('idle');
  showScreen('screenInput');
});
document.getElementById('backFromReportsBtn').addEventListener('click', () => showScreen('screenResults'));
</script>
</body>
